<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>税务文档解析 - 在线服务</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        /* Input Section */
        .input-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-left: 10px;
            border-left: 4px solid #667eea;
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 40px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="checkbox"] {
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            width: 100%;
            transition: border-color 0.3s;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
        }

        /* Button */
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Results Section */
        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            color: #666;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .card .value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }

        .card.success .value {
            color: #27ae60;
        }

        .card.error .value {
            color: #e74c3c;
        }

        .card.info .value {
            color: #3498db;
        }

        .card.warning .value {
            color: #f39c12;
        }

        /* Image Results */
        .images-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .images-section h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .image-item {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .image-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
        }

        .image-item.error {
            background-color: #fef5f5;
            border-color: #e74c3c;
        }

        .image-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .image-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.success {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.error {
            background: #f8d7da;
            color: #721c24;
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
            gap: 0;
        }

        .tab {
            padding: 12px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab:hover {
            color: #333;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Layout Info */
        .layout-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .layout-category {
            margin-bottom: 20px;
        }

        .layout-category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #e8eaf6;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
        }

        .layout-category-header:hover {
            background: #d1d5e8;
        }

        .layout-category-header.collapsed .expand-icon::before {
            content: '▶ ';
        }

        .layout-category-header .expand-icon::before {
            content: '▼ ';
        }

        .layout-category-title {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .layout-count {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }

        .layout-items {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .layout-items.collapsed {
            display: none;
        }

        .det-item {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }

        .det-item:last-child {
            border-bottom: none;
        }

        .det-text {
            color: #333;
            font-weight: 500;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .det-meta {
            display: flex;
            gap: 15px;
            color: #999;
            font-size: 12px;
        }

        .det-score {
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 3px;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .table-container table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .table-container th,
        .table-container td {
            padding: 12px;
            text-align: left;
            border: 1px solid #e0e0e0;
            font-size: 13px;
        }

        .table-container th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .table-container tr:nth-child(even) {
            background: #fafafa;
        }

        .table-container tr:hover {
            background: #f0f4ff;
        }

        /* Error Message */
        .error-message {
            background: #fef5f5;
            color: #e74c3c;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 13px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .summary-cards {
                grid-template-columns: 1fr;
            }

            .image-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .tabs {
                overflow-x: auto;
            }

            .tab {
                white-space: nowrap;
            }
        }

        /* Loading overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .loading-box .spinner {
            width: 40px;
            height: 40px;
            border-width: 4px;
        }

        .loading-box p {
            color: #666;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🔍 税务文档智能解析系统Demo</h1>
            <p>使用 OCR +布局分析+表格结构提取技术，自动解析税务文档并提取关键信息</p>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            
            <!-- 1. 服务器路径功能 (原功能) -->
            <div id="serverFormContainer">
                <div class="section-title">📁 服务器本地文件夹路径（开发人员测试用）</div>
                <form id="parseForm">
                    <div class="form-group">
                        <!-- <label for="directoryPath">📁 服务器本地文件夹路径（开发人员测试用）</label> -->
                        <input type="text" 
                               id="directoryPath" 
                               placeholder="例如: F:/images/tax_docs 或 /home/user/documents" 
                               required>
                    </div>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="recursiveCheck">
                            <label for="recursiveCheck">递归处理子文件夹</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span id="btnText">开始解析</span>
                    </button>
                </form>
            </div>

            <div class="divider"></div>

            <!-- 2. 上传文件功能 (新功能) -->
            <div id="uploadFormContainer">
                <div class="section-title">📄 上传本地文件解析</div>
                <form id="uploadForm">
                    <div class="form-group">
                        <label for="fileInput" style="font-weight: normal; color: #666;">支持 JPG, PNG, PDF, 所有文件总大小不超过 50MB</label>
                        <div style="border: 2px dashed #e0e0e0; padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; transition: all 0.3s;" 
                             id="dropZone"
                             onclick="document.getElementById('fileInput').click()">
                            <p style="color: #666; margin-bottom: 10px;">点击选择文件 或 拖拽文件到此处</p>
                            <p style="color: #999; font-size: 12px;">支持 .jpg, .png, .pdf 格式</p>
                        </div>
                        <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.pdf" style="display: none;">
                        <div id="fileList" style="margin-top: 15px; font-size: 13px; color: #666;"></div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="uploadBtn">
                        <span id="uploadBtnText">开始上传并解析</span>
                    </button>
                </form>
            </div>

        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-box">
                <div class="spinner"></div>
                <p>正在处理文档，请稍候...</p>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection">
            <!-- Summary Cards -->
            <div class="summary-cards">
                <div class="card info">
                    <h3>总文件数</h3>
                    <div class="value" id="totalImages">0</div>
                </div>
                <div class="card success">
                    <h3>成功处理</h3>
                    <div class="value" id="successCount">0</div>
                </div>
                <div class="card error">
                    <h3>处理失败</h3>
                    <div class="value" id="failedCount">0</div>
                </div>
                <div class="card warning">
                    <h3>缺公章</h3>
                    <div class="value" id="noSealCount">0</div>
                </div>
                <div class="card warning">
                    <h3>公章有误</h3>
                    <div class="value" id="wrongSealCount">0</div>
                </div>
                <div class="card">
                    <h3>提取率</h3>
                    <div class="value" id="successRate">0%</div>
                </div>
            </div>

            <!-- Images Section -->
            <div class="images-section">
                <h2>📊 处理结果详情</h2>
                <div id="imagesList"></div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('parseForm');
        const uploadForm = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const dropZone = document.getElementById('dropZone');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadBtnText = document.getElementById('uploadBtnText');
        
        const loadingOverlay = document.getElementById('loadingOverlay');
        const resultsSection = document.getElementById('resultsSection');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');

        // Drag and drop
        if (dropZone) {
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = '#667eea';
                dropZone.style.backgroundColor = '#f0f4ff';
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = '#e0e0e0';
                dropZone.style.backgroundColor = 'transparent';
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = '#e0e0e0';
                dropZone.style.backgroundColor = 'transparent';
                
                if (e.dataTransfer.files.length > 0) {
                    fileInput.files = e.dataTransfer.files;
                    updateFileList();
                }
            });
        }

        if (fileInput) {
            fileInput.addEventListener('change', updateFileList);
        }

        function updateFileList() {
            const files = fileInput.files;
            if (files.length > 0) {
                let html = `<p>已选择 ${files.length} 个文件:</p><ul style="list-style: none; margin-top: 5px;">`;
                let totalSize = 0;
                
                for (let i = 0; i < files.length; i++) {
                    const size = (files[i].size / 1024 / 1024).toFixed(2);
                    totalSize += files[i].size;
                    
                    let itemStyle = "margin-bottom: 3px;";
                    html += `<li style="${itemStyle}">📄 ${files[i].name} <span style="color: #999;">(${size} MB)</span></li>`;
                }
                html += '</ul>';
                
                const totalSizeMB = (totalSize / 1024 / 1024).toFixed(2);
                html += `<p style="margin-top: 10px; font-weight: bold; color: #666;">总大小: ${totalSizeMB} MB</p>`;
                
                fileList.innerHTML = html;
                
                if (totalSize > 50 * 1024 * 1024) {
                    uploadBtn.disabled = true;
                    fileList.innerHTML += `<p style="color: #e74c3c; margin-top: 5px; font-weight: bold;">⚠️ 总大小超过 50MB，无法上传</p>`;
                } else {
                    uploadBtn.disabled = false;
                }
            } else {
                fileList.innerHTML = '';
            }
        }

        if (uploadForm) {
            uploadForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const files = fileInput.files;
                if (files.length === 0) {
                    alert('请先选择文件');
                    return;
                }

                // Validate size again
                let totalSize = 0;
                for (let i = 0; i < files.length; i++) {
                    totalSize += files[i].size;
                }

                if (totalSize > 50 * 1024 * 1024) {
                    alert(`所有文件总大小超过 50MB 限制`);
                    return;
                }

                const formData = new FormData();
                for (let i = 0; i < files.length; i++) {
                    formData.append('files', files[i]);
                }
                
                // 添加 requesttag 标识，告诉后端这是前端可视化请求
                formData.append('requesttag', '1');

                // Show loading
                loadingOverlay.classList.add('active');
                uploadBtn.disabled = true;
                uploadBtnText.innerHTML = '<span class="spinner"></span>上传处理中...';

                try {
                    const response = await fetch('/upload_and_extract', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (response.ok && data.status === 'success') {
                        displayResults(data.data);
                        resultsSection.classList.add('active');
                    } else {
                        alert(`错误: ${data.message || '处理失败'}`);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert(`请求失败: ${error.message}`);
                } finally {
                    loadingOverlay.classList.remove('active');
                    uploadBtn.disabled = false;
                    uploadBtnText.textContent = '开始上传并解析';
                }
            });
        }

        // HTML 实体解码函数
        function decodeHtmlEntities(text) {
            const textarea = document.createElement('textarea');
            textarea.innerHTML = text;
            return textarea.value;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const directoryPath = document.getElementById('directoryPath').value.trim();
            const recursive = document.getElementById('recursiveCheck').checked;

            if (!directoryPath) {
                alert('请输入文件夹路径');
                return;
            }

            // Show loading
            loadingOverlay.classList.add('active');
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span>处理中...';

            try {
                const response = await fetch('/infoextract', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        directory_path: directoryPath,
                        recursive: recursive,
                        requesttag: 1
                    })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    displayResults(data.data);
                    resultsSection.classList.add('active');
                } else {
                    alert(`错误: ${data.message || '处理失败'}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert(`请求失败: ${error.message}`);
            } finally {
                loadingOverlay.classList.remove('active');
                submitBtn.disabled = false;
                btnText.textContent = '开始解析';
            }
        });

        function displayResults(results) {
            // DEBUG: 打印完整的返回数据
            console.log('【DEBUG】收到的完整数据:', results);
            console.log('【DEBUG】图像数组:', results.images);
            
            // Update summary
            document.getElementById('totalImages').textContent = results.total_images;
            document.getElementById('successCount').textContent = results.successful;
            document.getElementById('failedCount').textContent = results.failed;
            
            // Calculate seal stats
            let noSealCount = 0;
            let wrongSealCount = 0;
            if (results.images && Array.isArray(results.images)) {
                results.images.forEach(img => {
                    if (img.status === 'no-seal') noSealCount++;
                    if (img.status === 'wrong-seal') wrongSealCount++;
                });
            }
            if (document.getElementById('noSealCount')) document.getElementById('noSealCount').textContent = noSealCount;
            if (document.getElementById('wrongSealCount')) document.getElementById('wrongSealCount').textContent = wrongSealCount;

            const successRate = results.total_images > 0 
                ? Math.round((results.successful / results.total_images) * 100) 
                : 0;
            document.getElementById('successRate').textContent = successRate + '%';

            // Display images
            const imagesList = document.getElementById('imagesList');
            imagesList.innerHTML = '';

            results.images.forEach((image, index) => {
                console.log(`【DEBUG】处理第 ${index + 1} 张图像:`, image);
                const imageItem = createImageItem(image, index);
                imagesList.appendChild(imageItem);
            });
        }

        function createImageItem(image, index) {
            const item = document.createElement('div');
            item.className = `image-item ${image.status}`;

            if (image.status === 'error') {
                const fileName = image.image_path ? image.image_path.split(/[/\\]/).pop() : `文件 #${image.index}`;
                
                item.innerHTML = `
                    <div class="image-header">
                        <div class="image-title">📄 ${fileName}</div>
                        <span class="status-badge error">失败</span>
                    </div>
                    <div class="error-message">${image.message}</div>
                `;
            } else if (image.status === 'wrong-seal' || image.status === 'no-seal') {
                // 公章错误或无公章：显示警告信息 + 提取字段
                console.log('【DEBUG】公章警告状态:', image.status);
                console.log('【DEBUG】image 完整数据:', image);
                console.log('【DEBUG】extracted_fields:', image.extracted_fields);
                
                const statusText = image.status === 'wrong-seal' ? '公章错误' : '无公章';
                const fileName = image.image_path ? image.image_path.split(/[/\\]/).pop() : `文件 #${image.index}`;
                const hasExtractedFields = image.extracted_fields && Object.keys(image.extracted_fields).length > 0;
                
                console.log('【DEBUG】hasExtractedFields:', hasExtractedFields);
                if (image.extracted_fields) {
                    console.log('【DEBUG】extracted_fields 键:', Object.keys(image.extracted_fields));
                }
                
                let contentHtml = `
                    <div class="image-header">
                        <div class="image-title">📄 ${fileName}</div>
                        <span class="status-badge warning">${statusText}</span>
                    </div>
                    <div class="error-message" style="background: #fff3cd; color: #856404; border-left: 4px solid #ffc107;">
                        ⚠️ ${image.message}
                    </div>
                `;
                
                // 如果有提取字段，显示它们
                if (hasExtractedFields) {
                    contentHtml += '<div style="margin-top: 20px;">';
                    contentHtml += '<div style="background: #f8f9fa; border-radius: 8px; padding: 20px;">';
                    contentHtml += '<h4 style="color: #333; margin-bottom: 15px; font-size: 16px;">📋 提取的字段信息</h4>';
                    contentHtml += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px;">';
                    
                    for (const [fieldName, fieldValue] of Object.entries(image.extracted_fields)) {
                        let displayValue;
                        
                        if (!fieldValue || (Array.isArray(fieldValue) && fieldValue.every(v => !v))) {
                            displayValue = '<span style="color: #999;">未提取</span>';
                        } else if (fieldName === '页码' && typeof fieldValue === 'object' && !Array.isArray(fieldValue)) {
                            const currentPage = fieldValue.currentPage || fieldValue['currentPage'] || '1';
                            const totalPage = fieldValue.totalPage || fieldValue['totalPage'] || '1';
                            displayValue = `${currentPage} / ${totalPage}`;
                        } else if (Array.isArray(fieldValue)) {
                            displayValue = fieldValue.filter(v => v).join(' / ') || '<span style="color: #999;">未提取</span>';
                        } else if (typeof fieldValue === 'object') {
                            displayValue = JSON.stringify(fieldValue);
                        } else {
                            displayValue = fieldValue;
                        }
                        
                        contentHtml += `
                            <div style="background: white; border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px;">
                                <div style="color: #666; font-size: 12px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase;">
                                    ${fieldName}
                                </div>
                                <div style="color: #333; font-size: 14px; word-break: break-word;">
                                    ${displayValue}
                                </div>
                            </div>
                        `;
                    }
                    
                    contentHtml += '</div></div></div>';
                }
                
                item.innerHTML = contentHtml;
            } else {
                const hasTableData = image.tables && Object.keys(image.tables).length > 0;
                const hasGroupedData = image.grouped_data && Object.keys(image.grouped_data).length > 0;
                const hasExtractedFields = image.extracted_fields && Object.keys(image.extracted_fields).length > 0;
                
                // 检查是否有真正的表格数据（非空）
                const hasActualTableData = hasTableData && Object.values(image.tables).some(t => t.html && t.html.length > 0);

                let tabsHtml = '<div class="tabs">';
                // 默认显示提取字段，其次表格，最后布局
                tabsHtml += `<button class="tab ${hasExtractedFields ? 'active' : (!hasActualTableData && !hasGroupedData ? 'active' : '')}" data-tab="fields">提取字段</button>`;
                if (hasTableData) tabsHtml += `<button class="tab ${!hasExtractedFields && hasActualTableData ? 'active' : ''}" data-tab="tables">表格数据</button>`;
                if (hasGroupedData) tabsHtml += `<button class="tab ${!hasExtractedFields && !hasActualTableData && hasGroupedData ? 'active' : ''}" data-tab="layout">布局信息</button>`;
                tabsHtml += '</div>';

                let contentHtml = '';

                // Extracted Fields tab (新增)
                if (hasExtractedFields) {
                    contentHtml += `<div class="tab-content ${hasExtractedFields ? 'active' : ''}" data-content="fields">`;
                    contentHtml += '<div style="background: #f8f9fa; border-radius: 8px; padding: 20px;">';
                    contentHtml += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px;">';
                    
                    for (const [fieldName, fieldValue] of Object.entries(image.extracted_fields)) {
                        // 处理不同类型的字段值
                        let displayValue;
                        
                        if (!fieldValue || (Array.isArray(fieldValue) && fieldValue.every(v => !v))) {
                            // 空值处理
                            displayValue = '<span style="color: #999;">未提取</span>';
                        } else if (fieldName === '页码' && typeof fieldValue === 'object' && !Array.isArray(fieldValue)) {
                            // 特殊处理页码字段 - 对象格式 {"currentPage": "1", "totalPage": "1"}
                            console.log('***【DEBUG】处理页码字段:', fieldValue);
                            const currentPage = fieldValue.currentPage || fieldValue['currentPage'] || '1';
                            const totalPage = fieldValue.totalPage || fieldValue['totalPage'] || '1';
                            displayValue = `${currentPage} / ${totalPage}`;
                        } else if (Array.isArray(fieldValue)) {
                            // 数组格式（如金额合计）
                            displayValue = fieldValue.filter(v => v).join(' / ') || '<span style="color: #999;">未提取</span>';
                        } else if (typeof fieldValue === 'object') {
                            // 其他对象格式（兼容旧版格式）
                            displayValue = JSON.stringify(fieldValue);
                        } else {
                            // 字符串格式
                            displayValue = fieldValue;
                        }
                        
                        contentHtml += `
                            <div style="background: white; border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px;">
                                <div style="color: #666; font-size: 12px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase;">
                                    ${fieldName}
                                </div>
                                <div style="color: #333; font-size: 14px; word-break: break-word;">
                                    ${displayValue}
                                </div>
                            </div>
                        `;
                    }
                    
                    contentHtml += '</div></div></div>';
                }

                // Layout info tab
                if (hasGroupedData) {
                    contentHtml += `<div class="tab-content ${!hasExtractedFields && !hasActualTableData ? 'active' : ''}" data-content="layout">`;
                    contentHtml += '<div class="layout-info">';
                    for (const [label, data] of Object.entries(image.grouped_data)) {
                        const categoryId = `category-${index}-${label}`;
                        contentHtml += `
                            <div class="layout-category">
                                <div class="layout-category-header" onclick="toggleLayoutCategory('${categoryId}')">
                                    <div>
                                        <span class="expand-icon"></span>
                                        <span class="layout-category-title">${label}</span>
                                    </div>
                                    <span class="layout-count">${data.count} 项</span>
                                </div>
                                <div class="layout-items" id="${categoryId}">
                        `;
                        
                        // 展示每个 item 的 OCR 检测结果
                        data.items.forEach((item, itemIdx) => {
                            let text = item.text || '(无文本)';
                            let score = item.score ? (item.score * 100).toFixed(1) : '0';
                            let iou = item.iou ? (item.iou * 100).toFixed(1) : '0';
                            
                            contentHtml += `
                                <div class="det-item">
                                    <div class="det-text">📝 ${text}</div>
                                    <div class="det-meta">
                                        <span class="det-score">置信度: ${score}%</span>
                                        <span class="det-score">IoU: ${iou}%</span>
                                    </div>
                                </div>
                            `;
                        });
                        
                        contentHtml += `
                                </div>
                            </div>
                        `;
                    }
                    contentHtml += '</div></div>';
                }

                // Tables tab
                console.log('【DEBUG】检查表格数据...');
                console.log('hasTableData:', hasTableData);
                console.log('image.tables:', image.tables);
                console.log('tables 键:', Object.keys(image.tables));
                
                if (hasTableData) {
                    console.log('【DEBUG】创建表格标签页...');
                    contentHtml += `<div class="tab-content ${!hasExtractedFields && hasActualTableData ? 'active' : ''}" data-content="tables">`;
                    for (const [tableType, tableData] of Object.entries(image.tables)) {
                        // 调试：打印 HTML 内容
                        console.log('【DEBUG】处理表格:', tableType);
                        console.log('  tableData:', tableData);
                        console.log('  HTML 类型:', typeof tableData.html);
                        console.log('  HTML 长度:', tableData.html ? tableData.html.length : 0);
                        console.log('  HTML 内容预览:', tableData.html ? tableData.html.substring(0, 100) : '无内容');
                        if (tableData.html) {
                            console.log('  HTML 前100字符:', tableData.html.substring(0, 100));
                        }
                        
                        contentHtml += `
                            <div style="margin-bottom: 20px;">
                                <h4 style="color: #333; margin-bottom: 10px;">📋 ${tableType}</h4>
                                <div style="font-size: 12px; color: #999; margin-bottom: 10px;">${tableData.rows} 行 × ${tableData.cols} 列</div>
                                <div class="table-container table-render-${index}-${tableType}">
                                    <!-- 表格 HTML 将在这里插入 -->
                                </div>
                            </div>
                        `;
                    }
                    contentHtml += '</div>';
                }

                item.innerHTML = `
                    <div class="image-header">
                        <div class="image-title">📄 文件 #${image.index} - ${image.image_path ? image.image_path.split(/[/\\]/).pop() : `文件 #${image.index}`}</div>
                        <span class="status-badge success">成功</span>
                    </div>
                    ${tabsHtml}
                    ${contentHtml}
                `;

                // Insert table HTML - directly inject into specific div
                if (hasTableData) {
                    console.log('【DEBUG】开始插入表格 HTML...');
                    const tableEntries = Object.entries(image.tables);
                    console.log(`【DEBUG】共需插入 ${tableEntries.length} 个表格`);
                    
                    for (const [tableType, tableData] of tableEntries) {
                        const containerClass = `table-render-${index}-${tableType}`;
                        console.log(`【DEBUG】[${tableType}] 搜索容器: .${containerClass}`);
                        const container = item.querySelector('.' + containerClass);
                        
                        if (container) {
                            console.log(`【DEBUG】[${tableType}] ✓ 找到容器`);
                            if (tableData && tableData.html && tableData.html.length > 0) {
                                console.log(`【DEBUG】[${tableType}] 正在插入 HTML (长度: ${tableData.html.length})`);
                                try {
                                    // 如果 HTML 包含 <html> 或 <body> 标签，需要提取表格内容
                                    let htmlContent = tableData.html;
                                    
                                    // 检查是否有 <html> 或 <body> 标签
                                    if (htmlContent.includes('<html') || htmlContent.includes('<body')) {
                                        // 创建临时 DOM 来解析 HTML
                                        const tempDiv = document.createElement('div');
                                        tempDiv.innerHTML = htmlContent;
                                        
                                        // 找到表格
                                        const table = tempDiv.querySelector('table');
                                        if (table) {
                                            // 确保表格有正确的结构
                                            // 如果没有 thead，将第一行转换为 thead
                                            let tbody = table.querySelector('tbody');
                                            let thead = table.querySelector('thead');
                                            
                                            if (!thead && tbody) {
                                                const firstRow = tbody.querySelector('tr');
                                                if (firstRow) {
                                                    // 创建 thead
                                                    thead = document.createElement('thead');
                                                    const headerRow = firstRow.cloneNode(true);
                                                    
                                                    // 将 td 转换为 th
                                                    headerRow.querySelectorAll('td').forEach(td => {
                                                        const th = document.createElement('th');
                                                        th.textContent = td.textContent;
                                                        th.style.padding = td.style.padding;
                                                        td.parentNode.replaceChild(th, td);
                                                    });
                                                    
                                                    thead.appendChild(headerRow);
                                                    table.insertBefore(thead, tbody);
                                                    
                                                    // 移除原来的第一行 (因为现在在 thead 中了)
                                                    tbody.querySelector('tr').remove();
                                                    
                                                    console.log(`【DEBUG】[${tableType}] 已添加 thead 和格式化表头`);
                                                }
                                            }
                                            
                                            htmlContent = table.outerHTML;
                                            console.log(`【DEBUG】[${tableType}] 已提取并格式化表格元素`);
                                        } else {
                                            console.log(`【DEBUG】[${tableType}] ℹ 未找到表格元素，使用原始 HTML`);
                                        }
                                    }
                                    
                                    // 添加表格样式类
                                    if (!htmlContent.includes('class="')) {
                                        htmlContent = htmlContent.replace('<table>', '<table class="formatted-table">');
                                    }
                                    
                                    container.innerHTML = htmlContent;
                                    
                                    // 添加样式和边框
                                    const tableElement = container.querySelector('table');
                                    console.log('[chechecheck]',tableElement)
                                    if (tableElement) {
                                        tableElement.style.width = '100%';
                                        tableElement.style.borderCollapse = 'collapse';
                                        tableElement.style.backgroundColor = 'white';
                                        
                                        // 为所有单元格添加边框和填充
                                        tableElement.querySelectorAll('th, td').forEach(cell => {
                                            cell.style.border = '1px solid #e0e0e0';
                                            cell.style.padding = '12px';
                                            cell.style.textAlign = 'left';
                                            cell.style.fontSize = '13px';
                                        });
                                        
                                        // 为 th 添加背景色
                                        tableElement.querySelectorAll('th').forEach(th => {
                                            th.style.backgroundColor = '#f8f9fa';
                                            th.style.fontWeight = '600';
                                            th.style.color = '#333';
                                        });
                                        
                                        // 为行添加交替背景色
                                        tableElement.querySelectorAll('tbody tr').forEach((tr, idx) => {
                                            if (idx % 2 === 1) {
                                                tr.style.backgroundColor = '#fafafa';
                                            }
                                            tr.addEventListener('mouseover', () => {
                                                tr.style.backgroundColor = '#f0f4ff';
                                            });
                                            tr.addEventListener('mouseout', () => {
                                                tr.style.backgroundColor = (idx % 2 === 1) ? '#fafafa' : 'white';
                                            });
                                        });
                                    }
                                    
                                    console.log(`【DEBUG】[${tableType}] ✓ HTML 已插入成功并应用样式`);
                                } catch(e) {
                                    console.error(`【DEBUG】[${tableType}] ✗ 插入失败:`, e);
                                    container.innerHTML = `<p style="color: #e74c3c; padding: 20px;">表格显示失败: ${e.message}</p>`;
                                }
                            } else {

                                console.log(`【DEBUG】[${tableType}] ! HTML 为空或不存在 (status: ${tableData?.status || 'unknown'})`);
                                container.innerHTML = '<p style="color: #999; padding: 20px;">暂无表格数据</p>';
                            }
                        } else {
                            console.log(`【DEBUG】[${tableType}] ✗ 未找到容器元素`);
                            console.log(`【DEBUG】[${tableType}] 页面中所有 table-render 容器:`, item.querySelectorAll('[class*="table-render"]').length);
                        }
                    }
                    console.log('【DEBUG】表格插入流程完成');
                } else {
                    console.log('【DEBUG】❌ 没有表格数据需要插入');
                }

                // Add tab event listeners
                const tabs = item.querySelectorAll('.tab');
                tabs.forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        e.preventDefault();
                        const tabName = tab.dataset.tab;

                        // Remove active class
                        item.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                        item.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                        // Add active class
                        tab.classList.add('active');
                        item.querySelector(`[data-content="${tabName}"]`).classList.add('active');
                    });
                });
            }

            return item;
        }

        // Auto-hide loading overlay
        window.addEventListener('load', () => {
            loadingOverlay.classList.remove('active');
        });

        // 展开/折叠布局类别
        function toggleLayoutCategory(categoryId) {
            const category = document.getElementById(categoryId);
            const header = category.previousElementSibling;
            
            if (category.classList.contains('collapsed')) {
                category.classList.remove('collapsed');
                header.classList.remove('collapsed');
            } else {
                category.classList.add('collapsed');
                header.classList.add('collapsed');
            }
        }
    </script>
</body>
</html>
